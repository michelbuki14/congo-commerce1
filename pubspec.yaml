name: congo_commerce_flutter
description: "Congo Commerce - The DRC Marketplace for Local & Global Trade"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  # Required for MaterialApp localizations: MaterialLocalizations.of() returns
  # null for any locale DefaultMaterialLocalizations does not cover (fr, ln,
  # sw), which crashes every TextField subtree at first build.
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^14.8.1
  
  # Networking
  dio: ^5.7.0
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  
  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Auth tokens: Android Keystore / iOS Keychain.
  flutter_secure_storage: ^10.0.0

  
  # Serialization
  # UI & Theming
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  flutter_slidable: ^3.1.2
  
  # Utils
  uuid: ^4.5.0
  intl: ^0.20.3
  collection: ^1.18.0
  crypto: ^3.0.0
  mime: ^2.0.0
  
  # File & Media
  file_picker: ^13.1.0
  image: ^4.2.0
  image_picker: ^1.1.2
  
  url_launcher: ^6.3.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^5.0.0
  freezed: ^2.5.8
  riverpod_generator: ^2.6.4
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.4

# flutter_secure_storage 9.x pins flutter_secure_storage_windows 3.x, whose
# plugin C++ includes <atlstr.h> and therefore needs the ATL component of the
# Visual Studio C++ workload. ATL is not installed on this build machine and its
# installer requires interactive UAC elevation, so 3.x makes
# `flutter build windows` fail with error C1083.
#
# 4.x of the Windows backend replaced the ATL/CCom credential handling with
# win32 FFI over DPAPI, which compiles with the plain MSVC toolchain. Upgrading
# flutter_secure_storage to 10.x pulls that 4.x backend in; the override makes
# the intent explicit rather than incidental.
#
# The desktop-only plugins (window_manager, tray_manager, hotkey_manager,
# protocol_handler) were removed entirely: none were referenced from lib/, and
# protocol_handler 0.2.0 pins win32_registry ^1.0.2, which is unsolvable
# against the win32 6.x that the 4.x storage backend needs. Add them back when
# the desktop shell actually uses them, and expect the same conflict to return.
dependency_overrides:
  flutter_secure_storage_windows:
    path: third_party/flutter_secure_storage_windows

flutter:
  uses-material-design: true
  
  # Fonts are loaded at runtime by google_fonts (Poppins / Inter), so no
  # bundled .ttf assets are declared here.
  assets:
    - assets/images/
    - assets/icons/
